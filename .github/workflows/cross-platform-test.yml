name: Cross-Platform Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        powershell-version: ["7.4", "7.2"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell
        run: |
          # PowerShell should be available on all platforms, but let's verify
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "PowerShell not found, installing..."
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              # Install PowerShell on Ubuntu
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update
                wget -q https://packages.microsoft.com/config/ubuntu/20.04/packages-microsoft-prod.deb
                sudo dpkg -i packages-microsoft-prod.deb
                sudo apt-get update
                sudo apt-get install -y powershell
              else
                echo "sudo not available, trying without sudo..."
                apt-get update
                wget -q https://packages.microsoft.com/config/ubuntu/20.04/packages-microsoft-prod.deb
                dpkg -i packages-microsoft-prod.deb
                apt-get update
                apt-get install -y powershell
              fi
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
              # Install PowerShell on macOS
              if command -v brew >/dev/null 2>&1; then
                brew install --cask powershell
              else
                echo "Homebrew not available, PowerShell installation failed"
                exit 1
              fi
            fi
          fi
          pwsh --version

      - name: Install required modules
        shell: pwsh
        run: |
          # Install modules that the profile depends on
          $modules = @('Terminal-Icons', 'PSScriptAnalyzer')
          foreach ($module in $modules) {
            try {
              if (-not (Get-Module -Name $module -ListAvailable)) {
                Install-Module -Name $module -Force -Scope CurrentUser -ErrorAction Stop
                Write-Host "[OK] Installed $module"
              } else {
                Write-Host "[OK] $module already installed"
              }
            } catch {
              Write-Warning "Failed to install $module`: $_"
            }
          }

      - name: Test profile syntax
        shell: pwsh
        run: |
          # Test that the profile file can be parsed without errors
          try {
            $profileContent = Get-Content -Path "Microsoft.PowerShell_profile.ps1" -Raw
            $null = [scriptblock]::Create($profileContent)
            Write-Host "[OK] Profile syntax is valid"
          } catch {
            Write-Error "[ERROR] Profile syntax error: $_"
            exit 1
          }

      - name: Test module imports
        shell: pwsh
        run: |
          # Test that core modules can be imported
          $coreModules = @(
            "Core/Utils/unified_aliases.ps1",
            "Core/ModuleInstaller.ps1",
            "Core/UnifiedModuleManager.ps1"
          )

          foreach ($module in $coreModules) {
            try {
              if (Test-Path $module) {
                $null = Import-Module -Name $module -Force -ErrorAction Stop
                Write-Host "[OK] Successfully imported $module"
              } else {
                Write-Warning "Module file not found: $module"
              }
            } catch {
              Write-Error "[ERROR] Failed to import $module`: $_"
              exit 1
            }
          }

      - name: Test profile loading (dry run)
        shell: pwsh
        run: |
          # Test profile loading without actually executing it
          try {
            # Create a minimal test environment
            $testProfile = Join-Path $env:TEMP "test_profile.ps1"
            
            # Create test profile content without using here-strings with backticks
            $profileContent = @(
              "# Test profile loading",
              '$ProfileDir = Split-Path -Parent $PROFILE',
              'Write-Host "Profile directory: $ProfileDir"',
              "",
              "# Test basic functions exist",
              'if (Test-Path "Core/Utils/unified_aliases.ps1") {',
              '    Write-Host "[OK] Core files accessible"',
              "} else {",
              '    throw "Core files not accessible"',
              "}",
              "",
              'Write-Host "[OK] Profile structure test passed"'
            )
            
            $profileContent | Out-File -FilePath $testProfile -Encoding UTF8

            & pwsh -NoProfile -File $testProfile
            Write-Host "[OK] Profile loading test passed"
          } catch {
            Write-Error "[ERROR] Profile loading test failed: $_"
            exit 1
          } finally {
            if (Test-Path $testProfile) {
              Remove-Item $testProfile -Force
            }
          }