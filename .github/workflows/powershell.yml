# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# https://github.com/microsoft/action-psscriptanalyzer
# For more information on PSScriptAnalyzer in general, see
# https://github.com/PowerShell/PSScriptAnalyzer

name: PSScriptAnalyzer

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "42 14 * * 5"
  workflow_dispatch: {}

jobs:
  scan:
    permissions:
      contents: write
      security-events: write
      pull-requests: write
      actions: read
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: false
          fetch-depth: 0

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: powershell-modules-${{ runner.os }}-${{ hashFiles('**/requirements.psd1') }}
          restore-keys: |
            powershell-modules-${{ runner.os }}-

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f
        with:
          path: .\
          recurse: true
          includeRule: '"PSAvoidGlobalAliases", "PSAvoidUsingConvertToSecureStringWithPlainText"'
          output: results.sarif

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "Installing jq..."
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - name: Validate SARIF file
        run: |
          if [ ! -f results.sarif ]; then
            echo "SARIF file not found!"
            exit 1
          fi
          # Basic SARIF validation
          if ! jq empty results.sarif 2>/dev/null; then
            echo "Invalid SARIF file format"
            exit 1
          fi

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: Check for issues
        id: check-issues
        run: |
          # Check if SARIF file contains any actual issues
          issue_count=$(jq '.runs[0].results | length' results.sarif 2>/dev/null || echo "0")
          echo "issues_found=$issue_count" >> $GITHUB_OUTPUT
          echo "Found $issue_count issues"

      - name: Create Pull Request
        if: github.event_name != 'pull_request' && steps.check-issues.outputs.issues_found != '0'
        uses: ./.github/actions/create-security-pr
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore: update security fixes from PSScriptAnalyzer scan"
          title: "Security: PSScriptAnalyzer scan updates"
          body: |
            This PR contains security updates from the latest PSScriptAnalyzer scan.

            Please review the changes carefully before merging.
          branch: security/psscriptanalyzer-updates
          base: main
          add-paths: results.sarif
