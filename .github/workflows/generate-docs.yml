name: Generate Function Docs

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history to make branch comparisons and PR creation robust
          fetch-depth: 0
          # NOTE: submodules were temporarily disabled while the missing .gitmodules
          # entry was repaired. Re-enable submodule checkout so the runner fetches
          # repository submodules (required for Modules/Catppuccin).
          submodules: recursive

      - name: Setup PowerShell
        run: |
          # If pwsh is already available on the runner, use it. Otherwise install PowerShell.
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "pwsh not found — installing PowerShell 7..."
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y wget apt-transport-https software-properties-common ca-certificates gnupg
              DISTRO="$(. /etc/os-release && echo $ID$VERSION_ID)"
              wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
              sudo dpkg -i packages-microsoft-prod.deb
              sudo apt-get update
              sudo apt-get install -y powershell
            else
              echo "sudo not available, trying without sudo..."
              apt-get update
              apt-get install -y wget apt-transport-https software-properties-common ca-certificates gnupg
              DISTRO="$(. /etc/os-release && echo $ID$VERSION_ID)"
              wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
              dpkg -i packages-microsoft-prod.deb
              apt-get update
              apt-get install -y powershell
            fi
          fi
          pwsh -NoProfile -Command 'Write-Output ("pwsh version: " + (pwsh -v))'

      # The create-pull-request action requires a personal access token in some
      # repository configurations. We no longer fail the workflow when the
      # secret is missing; instead the PR creation step is gated to run only
      # when `PERSONAL_TOKEN` is present.

      - name: Run generator
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/generate_function_docs.ps1

      - name: Commit and create PR if docs changed
        uses: peter-evans/create-pull-request@v5
        continue-on-error: true
        with:
          # NOTE: the default GITHUB_TOKEN may not have sufficient permissions in some repo
          # configurations (for example when operating across forks). If you need a PAT,
          # add it to the repository secrets as `PERSONAL_TOKEN`. The action will use the
          # provided secret when present. The step is non-fatal so the workflow continues
          # even if PR creation fails due to token scoping. If you want to force the action
          # to use a PAT, uncomment the token line below and add the secret to the repo.
          # If you already stored a PAT under a different secret name, you can point
          # the action at that secret. This repository contains `PAT_TOKEN`, so we
          # reuse it here.
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: 'chore(docs): regenerate FunctionReference.md'
          title: 'chore(docs): regenerate FunctionReference.md'
          body: 'Automated docs regeneration by workflow'
          base: main
          branch: docs/regenerate-function-reference
