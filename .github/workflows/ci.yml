name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    lint-and-load:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Show PowerShell version
              shell: pwsh
              run: |
                  Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
                  Write-Host "OS: $($PSVersionTable.OS)"

            - name: Validate syntax of all PowerShell scripts
              shell: pwsh
              run: |
                  $failed = $false
                  $files = @(git ls-files '*.ps1' '*.psm1' '*.psd1' | ForEach-Object { Get-Item -LiteralPath $_ })
                  foreach ($file in $files) {
                      $tokens = $null
                      $errors = $null
                      $null = [System.Management.Automation.Language.Parser]::ParseFile(
                          $file.FullName, [ref]$tokens, [ref]$errors)
                      if ($errors.Count -gt 0) {
                          $failed = $true
                          foreach ($err in $errors) {
                              Write-Host "::error file=$($file.FullName),line=$($err.Extent.StartLineNumber)::$($err.Message)"
                          }
                      }
                  }
                  Write-Host "Parsed $($files.Count) PowerShell files."
                  if ($failed) { exit 1 }
                  Write-Host "Syntax validation passed."

            - name: Install validation modules
              shell: pwsh
              run: |
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
                  Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -MinimumVersion 1.21.0
                  Install-Module Pester -Scope CurrentUser -Force -MinimumVersion 5.0.0

            - name: Run PSScriptAnalyzer
              shell: pwsh
              run: |
                  $results = @(git ls-files '*.ps1' '*.psm1' '*.psd1' |
                      ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings .psscriptanalyzersettings.psd1 })
                  $results | ForEach-Object {
                      $level = if ($_.Severity -eq 'Error') { 'error' } else { 'warning' }
                      Write-Host "::$level file=$($_.ScriptPath),line=$($_.Line)::$($_.RuleName): $($_.Message)"
                  }
                  Write-Host "PSScriptAnalyzer: $($results.Count) total findings."
                  if ($results.Count -gt 0) { exit 1 }

            - name: Run Pester tests
              shell: pwsh
              run: |
                  $configuration = New-PesterConfiguration
                  $configuration.Run.Path = @('tests')
                  $configuration.Run.PassThru = $true
                  $configuration.Output.Verbosity = 'Detailed'
                  $result = Invoke-Pester -Configuration $configuration
                  if ($result.Result -ne 'Passed') { exit 1 }

            - name: Smoke test - dot-source the profile
              shell: pwsh
              run: |
                  # Best-effort load test. Optional CLI tools (starship, zoxide, gh, ...)
                  # are not installed on the runner; the profile guards their init behind
                  # command-existence checks, so they are skipped. In a non-interactive
                  # session the profile returns early after its base setup, so this test
                  # covers the always-executed section plus whatever the runner session
                  # allows. Full interactive behavior (prompt, PSReadLine handlers) is
                  # not covered here.
                  $ErrorActionPreference = 'Stop'
                  try {
                      . ./Microsoft.PowerShell_profile.ps1
                  }
                  catch {
                      Write-Host "::error::Profile dot-source failed: $_"
                      exit 1
                  }
                  Write-Host "Profile dot-source succeeded."
