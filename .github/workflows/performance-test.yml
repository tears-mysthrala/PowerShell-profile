name: Performance Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Weekly on Mondays at 2 AM UTC

jobs:
  performance:
    name: Profile Performance Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell
        run: |
          pwsh --version

      - name: Install required modules
        shell: pwsh
        run: |
          # Install minimal required modules for performance testing
          $modules = @('Terminal-Icons')
          foreach ($module in $modules) {
            try {
              if (-not (Get-Module -Name $module -ListAvailable)) {
                Install-Module -Name $module -Force -Scope CurrentUser -ErrorAction Stop
                Write-Host "[OK] Installed $module"
              }
            } catch {
              Write-Warning "Failed to install $module`: $_"
            }
          }

      - name: Run performance test
        shell: pwsh
        run: |
          # Simple performance test
          $startTime = Get-Date

          try {
            # Test basic profile loading
            $profileContent = Get-Content "Microsoft.PowerShell_profile.ps1" -Raw
            $null = [scriptblock]::Create($profileContent)
            Write-Host "[OK] Profile syntax is valid"
          } catch {
            Write-Error "[ERROR] Profile syntax error: $_"
            exit 1
          }

          $endTime = Get-Date
          $loadTime = ($endTime - $startTime).TotalMilliseconds

          Write-Host "Profile validation time: $loadTime ms"

          # Performance thresholds (syntax check only)
          $errorThreshold = 5000  # 5 seconds

          if ($loadTime -gt $errorThreshold) {
            Write-Error "[FAIL] Profile validation too slow: $loadTime ms"
            exit 1
          } else {
            Write-Host "[PASS] Profile validation time acceptable: $loadTime ms"
          }

          # Output for GitHub Actions
          echo "LOAD_TIME_MS=$loadTime" >> $env:GITHUB_ENV

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const loadTime = process.env.LOAD_TIME_MS;
            const threshold = 5000;

            let message = `## Performance Test Results\n\n`;
            message += `Profile validation time: **${loadTime}ms**\n\n`;

            if (parseFloat(loadTime) > threshold) {
              message += `WARNING: Validation time exceeds threshold of ${threshold}ms\n`;
              message += `Consider optimizing profile validation.\n`;
            } else {
              message += `SUCCESS: Validation time is within acceptable range.\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });