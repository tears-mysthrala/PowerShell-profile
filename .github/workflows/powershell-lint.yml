name: Lint PowerShell and Markdown

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  powershell-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = Resolve-Path -Path ./.psscriptanalyzersettings.psd1 -ErrorAction SilentlyContinue
          if (-not $settings) { Write-Host 'No .psscriptanalyzersettings.psd1 found; continuing with defaults' }
          $files = Get-ChildItem -Path . -Include *.ps1,*.psm1,*.psd1 -Recurse | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) { Write-Host 'No PowerShell files found'; exit 0 }
          foreach ($f in $files) {
            Write-Host "Analyzing $f"
            if ($settings) {
              Invoke-ScriptAnalyzer -Path $f -Recurse -Severity Warning -SettingsPath $settings -EnableExit
            } else {
              Invoke-ScriptAnalyzer -Path $f -Recurse -Severity Warning -EnableExit
            }
          }

  super-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Super-Linter
        uses: github/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: debug

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run markdownlint
        run: |
          npm install -g markdownlint-cli
          markdownlint '**/*.md'


